name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./ci.sqlite3
          KEITARO_API_KEY: dummy
      - run: pytest
